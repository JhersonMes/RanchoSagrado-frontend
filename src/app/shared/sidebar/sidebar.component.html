<aside class="w-64 shrink-0 bg-white border-r border-slate-200 flex flex-col h-screen sticky top-0">
  <div class="sidebar-brand">
    <img src="images/logo.png" alt="El Rancho Sagrado" class="sidebar-brand-logo" />
    <p class="sidebar-brand-title">RanchoOnline</p>
    <p class="sidebar-brand-subtitle">Sistema de Gestión</p>
  </div>

  <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
    @for (item of links(); track item.link) {
      <a
        [routerLink]="item.link"
        routerLinkActive="bg-amber-50 text-amber-700 sidebar-link-active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="relative flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-500 hover:bg-slate-50 transition-colors"
      >
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="iconPath(item.icon)" />
        </svg>
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="p-4 border-t border-slate-100 space-y-2">
    <a
      routerLink="/pages/order/new"
      class="w-full flex items-center justify-center gap-2 rounded-lg bg-red-600 py-2.5 text-sm font-semibold text-white hover:bg-red-700 transition-colors"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      Nuevo Pedido
    </a>
    <button
      (click)="confirmLogout()"
      type="button"
      class="w-full rounded-full border border-slate-200 py-2.5 text-sm font-semibold text-slate-500 hover:bg-slate-50 transition-colors"
    >
      Cerrar sesión
    </button>
  </div>
</aside>

@if (showLogoutModal()) {
  <div class="logout-modal-overlay" (click)="cancelLogout()">
    <div class="logout-modal-panel" (click)="$event.stopPropagation()">
      <div class="logout-modal-icon">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0 3.75h.008M10.29 3.86l-8.18 14.18A1.5 1.5 0 003.5 20.25h17a1.5 1.5 0 001.39-2.21L13.71 3.86a1.5 1.5 0 00-2.42 0z" />
        </svg>
      </div>
      <h3 class="logout-modal-title">Cerrar sesión</h3>
      <p class="logout-modal-message">¿Estás seguro de que deseas cerrar tu sesión actual?</p>
      <div class="logout-modal-actions">
        <button type="button" class="logout-modal-cancel" (click)="cancelLogout()">Cancelar</button>
        <button type="button" class="logout-modal-confirm" (click)="logout()">Confirmar</button>
      </div>
    </div>
  </div>
}
