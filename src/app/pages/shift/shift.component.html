<router-outlet></router-outlet>

<div class="page">
  <a class="page-back" routerLink="/pages/business">
    <mat-icon>arrow_back</mat-icon>
    Volver a la Gestión de Negocio
  </a>

  <div class="page-head">
    <div>
      <h1 class="page-title">Lista de Turnos</h1>
      <p class="page-subtitle">Administra los turnos registrados.</p>
    </div>
    <button class="btn-primary" routerLink="/pages/shift/new">
      <mat-icon>add</mat-icon>
      Nuevo Turno
    </button>
  </div>

  <div class="search-box">
    <mat-icon>search</mat-icon>
    <input (keyup)="applyFilter($event)" placeholder="Buscar por nombre..." #input>
  </div>

  <div class="table-card">
    <div class="table-scroll">
      <table mat-table [dataSource]="$dataSource()" matSort>
        <ng-container matColumnDef="idShift">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
          <td mat-cell *matCellDef="let row"> {{row.idShift}} </td>
        </ng-container>
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> NOMBRE </th>
          <td mat-cell *matCellDef="let row"> {{row.name}} </td>
        </ng-container>
        <ng-container matColumnDef="startTime">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> INICIO </th>
          <td mat-cell *matCellDef="let row"> {{row.startTime}} </td>
        </ng-container>
        <ng-container matColumnDef="endTime">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> FIN </th>
          <td mat-cell *matCellDef="let row"> {{row.endTime}} </td>
        </ng-container>
        <ng-container matColumnDef="daysOfWeek">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> DÍAS </th>
          <td mat-cell *matCellDef="let row"> {{row.daysOfWeek}} </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> ACCIONES </th>
          <td mat-cell *matCellDef="let row">
            <a class="action-link edit" [routerLink]="['edit', row.idShift]"><mat-icon>edit</mat-icon>Editar</a>
            <a class="action-link delete" (click)="delete(row.idShift)"><mat-icon>delete</mat-icon>Eliminar</a>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="mat-row" *matNoDataRow><td class="mat-cell" colspan="6">¡Aun no hay información para mostrar!</td></tr>
      </table>
    </div>

    <mat-paginator
      [length]="pageable.length()"
      [pageIndex]="pageable.pageIndex()"
      [pageSize]="pageable.pageSize()"
      [pageSizeOptions]="[5,10,25]"
      (page)="pageable.onPage($event)"
    ></mat-paginator>
  </div>
</div>
