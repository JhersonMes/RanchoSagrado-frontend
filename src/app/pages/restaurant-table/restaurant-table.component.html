<router-outlet></router-outlet>

<div class="page">
  <a class="page-back" routerLink="/pages/business">
    <mat-icon>arrow_back</mat-icon>
    Volver a la Gestión de Negocio
  </a>

  <div class="page-head">
    <div>
      <h1 class="page-title">Lista de Mesas</h1>
      <p class="page-subtitle">Administra las mesas registradas.</p>
    </div>
    <button class="btn-primary" routerLink="/pages/restaurant-table/new">
      <mat-icon>add</mat-icon>
      Nueva Mesa
    </button>
  </div>

  <div class="search-box">
    <mat-icon>search</mat-icon>
    <input (keyup)="applyFilter($event)" placeholder="Buscar por número, ubicación..." #input>
  </div>

  <div class="table-card">
    <div class="table-scroll">
      <table mat-table [dataSource]="$dataSource()" matSort>
        <ng-container matColumnDef="idTable">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
          <td mat-cell *matCellDef="let row"> {{row.idTable}} </td>
        </ng-container>
        <ng-container matColumnDef="tableNumber">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> N° MESA </th>
          <td mat-cell *matCellDef="let row"> {{row.tableNumber}} </td>
        </ng-container>
        <ng-container matColumnDef="capacity">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> CAPACIDAD </th>
          <td mat-cell *matCellDef="let row"> {{row.capacity}} </td>
        </ng-container>
        <ng-container matColumnDef="location">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> UBICACIÓN </th>
          <td mat-cell *matCellDef="let row"> {{row.location}} </td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> ESTADO </th>
          <td mat-cell *matCellDef="let row"> {{row.status}} </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> ACCIONES </th>
          <td mat-cell *matCellDef="let row">
            <a class="action-link edit" [routerLink]="['edit', row.idTable]"><mat-icon>edit</mat-icon>Editar</a>
            <a class="action-link delete" (click)="delete(row.idTable)"><mat-icon>delete</mat-icon>Eliminar</a>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="mat-row" *matNoDataRow><td class="mat-cell" colspan="6">¡Aun no hay información para mostrar!</td></tr>
      </table>
    </div>

    <mat-paginator
      [length]="pageable.length()"
      [pageIndex]="pageable.pageIndex()"
      [pageSize]="pageable.pageSize()"
      [pageSizeOptions]="[5,10,25]"
      (page)="pageable.onPage($event)"
    ></mat-paginator>
  </div>
</div>
