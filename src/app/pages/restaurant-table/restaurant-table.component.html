<router-outlet></router-outlet>
<mat-form-field>
  <mat-label>Filter</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ex. VIP" #input>
</mat-form-field>
<div class="mat-elevation-z8">
  <table mat-table [dataSource]="$dataSource()" matSort>
    <ng-container matColumnDef="idTable">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let row"> {{row.idTable}} </td>
    </ng-container>
    <ng-container matColumnDef="tableNumber">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> TABLE # </th>
      <td mat-cell *matCellDef="let row"> {{row.tableNumber}} </td>
    </ng-container>
    <ng-container matColumnDef="capacity">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> CAPACITY </th>
      <td mat-cell *matCellDef="let row"> {{row.capacity}} </td>
    </ng-container>
    <ng-container matColumnDef="location">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> LOCATION </th>
      <td mat-cell *matCellDef="let row"> {{row.location}} </td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> STATUS </th>
      <td mat-cell *matCellDef="let row"> {{row.status}} </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> ACTIONS </th>
      <td mat-cell *matCellDef="let row">
        <button mat-flat-button [routerLink]="['edit', row.idTable]"><span>Edit</span><mat-icon>edit</mat-icon></button>
        <button mat-flat-button class="cancel-button" (click)="delete(row.idTable)"><span>Delete</span><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    <tr class="mat-row" *matNoDataRow><td class="mat-cell" colspan="6">No data matching "{{input.value}}"</td></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[5,10,25]"></mat-paginator>
  <button mat-fab style="float: right;" routerLink="/pages/restaurant-table/new"><mat-icon>add</mat-icon></button>
</div>
