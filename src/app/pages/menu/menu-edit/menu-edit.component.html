<form [formGroup]="$form()" (submit)="operate()" class="example-container">

    <div [hidden]="true">
        <mat-form-field><input matInput formControlName="idMenu"></mat-form-field>
    </div>

    <mat-form-field>
        <mat-label>Name</mat-label>
        <input matInput placeholder="Menu name" formControlName="name">
    </mat-form-field>

    <mat-form-field>
        <mat-label>Dish Quantity</mat-label>
        <input matInput type="number" placeholder="0" formControlName="dishQuantity">
    </mat-form-field>

    <mat-form-field>
        <mat-label>Price</mat-label>
        <input matInput type="number" placeholder="0.00" formControlName="price">
    </mat-form-field>

    <mat-form-field>
        <mat-label>Description</mat-label>
        <input matInput placeholder="Description" formControlName="description">
    </mat-form-field>

    <button mat-flat-button type="submit">
        <span>OK</span>
        <mat-icon>done</mat-icon>
    </button>

    <button mat-flat-button type="button" class="cancel-button" routerLink="/pages/menu">
        <span>Cancel</span>
        <mat-icon>cancel</mat-icon>
    </button>

</form>
