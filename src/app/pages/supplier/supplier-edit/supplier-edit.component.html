<form [formGroup]="$form()" (submit)="operate()" class="example-container">
    <app-form-header [title]="$isEdit() ? 'Editar Proveedor' : 'Agregar Proveedor'" [form]="$form()"></app-form-header>


    <div [hidden]="true">
        <mat-form-field>
            <mat-label>ID</mat-label>
            <input matInput formControlName="idSupplier">
        </mat-form-field>
    </div>

    <mat-form-field>
        <mat-label>Company Name</mat-label>
        <input matInput placeholder="Company Name" formControlName="companyName">
    </mat-form-field>

    <mat-form-field>
        <mat-label>RUC</mat-label>
        <input matInput placeholder="RUC" formControlName="ruc" appRucInput>
        @if ($form().get('ruc')?.hasError('ruc') && $form().get('ruc')?.touched) {
            <mat-error>El RUC debe tener 11 dígitos y un prefijo válido (10, 15, 17 o 20).</mat-error>
        }
    </mat-form-field>

    <mat-form-field>
        <mat-label>Contact Email</mat-label>
        <input matInput placeholder="email@example.com" formControlName="contactEmail" type="email">
    </mat-form-field>

    <mat-form-field>
        <mat-label>Phone</mat-label>
        <input matInput placeholder="Phone" formControlName="phone" appPhoneInput>
    </mat-form-field>

    <mat-form-field>
        <mat-label>Address</mat-label>
        <input matInput placeholder="Address" formControlName="address">
    </mat-form-field>

    <mat-form-field>
        <mat-label>Supply Type</mat-label>
        <input matInput placeholder="Supply Type" formControlName="supplyType">
    </mat-form-field>

    <mat-form-field>
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
            @for (s of statuses; track s) {
                <mat-option [value]="s">{{ s }}</mat-option>
            }
        </mat-select>
    </mat-form-field>

    <div class="form-actions">
    <button mat-flat-button type="submit">
        <span>Guardar</span>
        <mat-icon>done</mat-icon>
    </button>
    <button mat-flat-button type="button" class="cancel-button" routerLink="/pages/supplier">
        <span>Cancelar</span>
        <mat-icon>cancel</mat-icon>
    </button>
</div>

</form>
