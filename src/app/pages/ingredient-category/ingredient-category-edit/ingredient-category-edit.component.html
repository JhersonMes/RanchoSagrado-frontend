<form [formGroup]="$form()" (submit)="operate()" class="example-container">
    <app-form-header [title]="$isEdit() ? 'Editar Categoría de Ingrediente' : 'Agregar Categoría de Ingrediente'" [form]="$form()"></app-form-header>

    <div [hidden]="true"><mat-form-field><input matInput formControlName="idCategory"></mat-form-field></div>

    <mat-form-field>
        <mat-label>Category Name</mat-label>
        <input matInput placeholder="Category Name" formControlName="name">
    </mat-form-field>

    <div class="form-actions">
    <button mat-flat-button type="submit"><span>Guardar</span><mat-icon>done</mat-icon></button>
    <button mat-flat-button type="button" class="cancel-button" routerLink="/pages/ingredient-category">
        <span>Cancelar</span><mat-icon>cancel</mat-icon>
    </button>
</div>
</form>
