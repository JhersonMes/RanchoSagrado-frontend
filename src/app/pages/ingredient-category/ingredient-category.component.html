<router-outlet></router-outlet>

<div class="page">
  <a class="page-back" routerLink="/pages/business">
    <mat-icon>arrow_back</mat-icon>
    Volver a la Gestión de Negocio
  </a>

  <div class="page-head">
    <div>
      <h1 class="page-title">Lista de Categorías de Ingrediente</h1>
      <p class="page-subtitle">Administra las categorías de ingrediente registradas.</p>
    </div>
    <button class="btn-primary" routerLink="/pages/ingredient-category/new">
      <mat-icon>add</mat-icon>
      Nueva Categoría
    </button>
  </div>

  <div class="search-box">
    <mat-icon>search</mat-icon>
    <input (keyup)="applyFilter($event)" placeholder="Buscar por nombre..." #input>
  </div>

  <div class="table-card">
    <div class="table-scroll">
      <table mat-table [dataSource]="$dataSource()" matSort>

        <ng-container matColumnDef="idCategory">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
          <td mat-cell *matCellDef="let row"> {{row.idCategory}} </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> NOMBRE </th>
          <td mat-cell *matCellDef="let row"> {{row.name}} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> ACCIONES </th>
          <td mat-cell *matCellDef="let row">
            <a class="action-link edit" [routerLink]="['edit', row.idCategory]"><mat-icon>edit</mat-icon>Editar</a>
            <a class="action-link delete" (click)="delete(row.idCategory)"><mat-icon>delete</mat-icon>Eliminar</a>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="3">No hay resultados para "{{input.value}}"</td>
        </tr>
      </table>
    </div>

    <mat-paginator [pageSizeOptions]="[5,10,25]"></mat-paginator>
  </div>
</div>
