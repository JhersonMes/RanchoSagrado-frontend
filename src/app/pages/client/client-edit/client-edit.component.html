<form [formGroup]="$form()" (submit)="operate()" class="example-container" #frmClient="ngForm">

    <div [hidden]="true">
        <mat-form-field>
            <mat-label>ID</mat-label>
            <input matInput placeholder="ID" formControlName="idClient">
        </mat-form-field>
    </div>

    <mat-form-field>
        <mat-label>DNI</mat-label>
        <input matInput placeholder="DNI" formControlName="dni" type="number">
    </mat-form-field>

    <mat-form-field>
        <mat-label>Name</mat-label>
        <input matInput placeholder="Name" formControlName="name">
    </mat-form-field>

    <mat-form-field>
        <mat-label>Last Name</mat-label>
        <input matInput placeholder="Last Name" formControlName="lastName">
    </mat-form-field>

    <mat-form-field>
        <mat-label>Phone</mat-label>
        <input matInput placeholder="Phone" formControlName="phone">
    </mat-form-field>

    <mat-form-field>
        <mat-label>Email</mat-label>
        <input matInput placeholder="Email" formControlName="email">
    </mat-form-field>

    <mat-form-field>
        <mat-label>Birth Date</mat-label>
        <input matInput placeholder="Birth Date" formControlName="birthDate" type="date">
    </mat-form-field>

    <mat-form-field>
        <mat-label>Address</mat-label>
        <input matInput placeholder="Address" formControlName="address">
    </mat-form-field>

    <mat-form-field>
        <mat-label>RUC</mat-label>
        <input matInput placeholder="RUC" formControlName="ruc">
    </mat-form-field>

    <button mat-flat-button type="submit">
        <span>OK</span>
        <mat-icon>done</mat-icon>
    </button>

    <button mat-flat-button type="button" class="cancel-button" routerLink="/pages/client">
        <span>Cancel</span>
        <mat-icon>cancel</mat-icon>
    </button>

</form>
