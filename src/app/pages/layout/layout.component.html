<div class="app-shell">
    <header class="app-topbar">
        <h1 class="app-topbar-title">{{ pageTitle() }}</h1>

        <button class="app-user" [matMenuTriggerFor]="menu" type="button">
            <span class="app-user-info">
                <span class="app-user-name">{{ userName() }}</span>
                @if (userRole()) {
                <span class="app-user-role">{{ userRole() }}</span>
                }
            </span>
            <span class="app-user-avatar">{{ userInitial() }}</span>
        </button>

        <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="logout()">
                <mat-icon>exit_to_app</mat-icon>
                <span>Cerrar sesión</span>
            </button>
        </mat-menu>
    </header>

    <main class="app-content">
        <router-outlet></router-outlet>
    </main>
</div>
