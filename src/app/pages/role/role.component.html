<router-outlet></router-outlet>

<div class="page">
  <app-back-to-home></app-back-to-home>

  <div class="page-head">
    <div>
      <h1 class="page-title">Lista de Roles</h1>
      <p class="page-subtitle">Administra los roles registrados.</p>
    </div>
    <button class="btn-primary" routerLink="/pages/role/new">
      <mat-icon>add</mat-icon>
      Nuevo Rol
    </button>
  </div>

  <div class="search-box">
    <mat-icon>search</mat-icon>
    <input (keyup)="applyFilter($event)" placeholder="Buscar por nombre..." #input>
  </div>

  <div class="table-card">
    <div class="table-scroll">
      <table mat-table [dataSource]="$dataSource()" matSort>

        <ng-container matColumnDef="idRole">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
          <td mat-cell *matCellDef="let row"> {{row.idRole}} </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> NOMBRE </th>
          <td mat-cell *matCellDef="let row"> {{row.name}} </td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> DESCRIPCIÓN </th>
          <td mat-cell *matCellDef="let row"> {{row.description}} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> ACCIONES </th>
          <td mat-cell *matCellDef="let row">
            <a class="action-link edit" [routerLink]="['edit', row.idRole]"><mat-icon>edit</mat-icon>Editar</a>
            <a class="action-link delete" (click)="delete(row.idRole)"><mat-icon>delete</mat-icon>Eliminar</a>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">¡Aun no hay información para mostrar!</td>
        </tr>
      </table>
    </div>

    <mat-paginator
      [length]="pageable.length()"
      [pageIndex]="pageable.pageIndex()"
      [pageSize]="pageable.pageSize()"
      [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of roles"
      (page)="pageable.onPage($event)"
    ></mat-paginator>
  </div>
</div>
