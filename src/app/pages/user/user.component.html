<router-outlet></router-outlet>

<div class="page">
  <app-back-to-home></app-back-to-home>

  <div class="page-head">
    <div>
      <h1 class="page-title">Lista de Usuarios</h1>
      <p class="page-subtitle">Administra los usuarios registrados.</p>
    </div>
    <button class="btn-primary" routerLink="/pages/user/new">
      <mat-icon>add</mat-icon>
      Nuevo Usuario
    </button>
  </div>

  <div class="search-box">
    <mat-icon>search</mat-icon>
    <input (keyup)="applyFilter($event)" placeholder="Buscar por usuario, email..." #input>
  </div>

  <div class="table-card">
    <div class="table-scroll">
      <table mat-table [dataSource]="$dataSource()" matSort>

        <ng-container matColumnDef="idUser">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
          <td mat-cell *matCellDef="let row"> {{row.idUser}} </td>
        </ng-container>

        <ng-container matColumnDef="username">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> USUARIO </th>
          <td mat-cell *matCellDef="let row"> {{row.username}} </td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> EMAIL </th>
          <td mat-cell *matCellDef="let row"> {{row.email}} </td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> ROL </th>
          <td mat-cell *matCellDef="let row">
            <mat-chip>{{row.role?.name}}</mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="enabled">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> ESTADO </th>
          <td mat-cell *matCellDef="let row">
            <span class="badge" [class.badge-success]="row.enabled" [class.badge-danger]="!row.enabled">
              {{row.enabled ? 'Activo' : 'Inactivo'}}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> ACCIONES </th>
          <td mat-cell *matCellDef="let row">
            <a class="action-link edit" [routerLink]="['edit', row.idUser]"><mat-icon>edit</mat-icon>Editar</a>
            <a class="action-link delete" (click)="delete(row.idUser)"><mat-icon>delete</mat-icon>Eliminar</a>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="7">¡Aun no hay información para mostrar!</td>
        </tr>
      </table>
    </div>

    <mat-paginator
      [length]="pageable.length()"
      [pageIndex]="pageable.pageIndex()"
      [pageSize]="pageable.pageSize()"
      [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"
      (page)="pageable.onPage($event)"
    ></mat-paginator>
  </div>
</div>
