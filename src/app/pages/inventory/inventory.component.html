<router-outlet></router-outlet>
<mat-form-field>
  <mat-label>Filter</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Sal" #input>
</mat-form-field>
<div class="mat-elevation-z8">
  <table mat-table [dataSource]="$dataSource()" matSort>
    <ng-container matColumnDef="idInventory">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let row"> {{row.idInventory}} </td>
    </ng-container>
    <ng-container matColumnDef="ingredient">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> INGREDIENT </th>
      <td mat-cell *matCellDef="let row"> {{row.ingredient?.name}} </td>
    </ng-container>
    <ng-container matColumnDef="stockQuantity">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> STOCK </th>
      <td mat-cell *matCellDef="let row"> {{row.stockQuantity}} </td>
    </ng-container>
    <ng-container matColumnDef="minStock">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> MIN </th>
      <td mat-cell *matCellDef="let row"> {{row.minStock}} </td>
    </ng-container>
    <ng-container matColumnDef="maxStock">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> MAX </th>
      <td mat-cell *matCellDef="let row"> {{row.maxStock}} </td>
    </ng-container>
    <ng-container matColumnDef="lastReplenishmentDate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> LAST REPLENISHMENT </th>
      <td mat-cell *matCellDef="let row"> {{row.lastReplenishmentDate | date:'shortDate'}} </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> ACTIONS </th>
      <td mat-cell *matCellDef="let row">
        <button mat-flat-button [routerLink]="['edit', row.idInventory]"><span>Edit</span><mat-icon>edit</mat-icon></button>
        <button mat-flat-button class="cancel-button" (click)="delete(row.idInventory)"><span>Delete</span><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    <tr class="mat-row" *matNoDataRow><td class="mat-cell" colspan="7">No data matching "{{input.value}}"</td></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[5,10,25]"></mat-paginator>
  <button mat-fab style="float: right;" routerLink="/pages/inventory/new"><mat-icon>add</mat-icon></button>
</div>
