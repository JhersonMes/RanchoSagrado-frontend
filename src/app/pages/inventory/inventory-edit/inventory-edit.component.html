<form [formGroup]="$form()" (submit)="operate()" class="example-container">
    <div [hidden]="true"><mat-form-field><input matInput formControlName="idInventory"></mat-form-field></div>

    <mat-form-field>
        <mat-label>Ingredient</mat-label>
        <mat-select formControlName="ingredient" [compareWith]="compareFn">
            @for (ing of ingredientService.$listChange(); track ing.idIngredient) {
                <mat-option [value]="ing">{{ing.name}} ({{ing.unitOfMeasure}})</mat-option>
            }
        </mat-select>
    </mat-form-field>

    <mat-form-field>
        <mat-label>Stock Quantity</mat-label>
        <input matInput type="number" placeholder="0" formControlName="stockQuantity">
    </mat-form-field>

    <mat-form-field>
        <mat-label>Min Stock</mat-label>
        <input matInput type="number" placeholder="0" formControlName="minStock">
    </mat-form-field>

    <mat-form-field>
        <mat-label>Max Stock</mat-label>
        <input matInput type="number" placeholder="0" formControlName="maxStock">
    </mat-form-field>

    <mat-form-field>
        <mat-label>Last Replenishment Date</mat-label>
        <input matInput type="date" formControlName="lastReplenishmentDate">
    </mat-form-field>

    <button mat-flat-button type="submit"><span>OK</span><mat-icon>done</mat-icon></button>
    <button mat-flat-button type="button" class="cancel-button" routerLink="/pages/inventory">
        <span>Cancel</span><mat-icon>cancel</mat-icon>
    </button>
</form>
